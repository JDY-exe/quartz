name: Deploy

on:
  push:
    branches: [v5]
  workflow_dispatch:

concurrency:
  group: quartz-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, quartz]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Publish atomically
        env:
          RELEASE_DIR: /home/jdy/Sites/quartz/releases/${{ github.sha }}
        run: |
          mkdir -p "$RELEASE_DIR"
          cp -a public/. "$RELEASE_DIR/"
          ln -sfn "$RELEASE_DIR" /home/jdy/Sites/quartz/current

